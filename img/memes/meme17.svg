<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c2333"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Top Meme Header -->
  <rect x="16" y="12" width="368" height="26" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="1.5" text-anchor="middle" filter="url(#glow)">SMOOTH SAILING</text>
  <!-- Artwork Graphic -->
  <g id="artwork">
    
      <!-- Green Traffic Light -->
      <rect x="75" y="60" width="35" height="85" rx="8" fill="#1e293b"/>
      <circle cx="92" cy="78" r="8" fill="#475569"/>
      <circle cx="92" cy="102" r="8" fill="#475569"/>
      <circle cx="92" cy="126" r="10" fill="#22c55e" stroke="#86efac" stroke-width="2"/>
      <!-- Cool Duck on Rainbow Slide -->
      <path d="M120,80 Q200,120 280,175" stroke="#ec4899" stroke-width="8" fill="none"/>
      <path d="M120,88 Q200,128 280,183" stroke="#eab308" stroke-width="8" fill="none"/>
      <path d="M120,96 Q200,136 280,191" stroke="#38bdf8" stroke-width="8" fill="none"/>
      <!-- Duck with Shades -->
      <circle cx="220" cy="120" r="26" fill="#facc15"/>
      <ellipse cx="242" cy="122" rx="12" ry="6" fill="#f97316"/>
      <!-- Sunglasses -->
      <polygon points="208,114 232,114 228,124 212,124" fill="#0f172a"/>
    
  </g>
  <!-- Bottom Meme Caption -->
  <rect x="12" y="202" width="376" height="28" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="200" y="221" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">ĐÈN XANH SUỐT TUYẾN - TRỜI MƯA KHÔNG ƯỚT TÓC</text>
</svg>