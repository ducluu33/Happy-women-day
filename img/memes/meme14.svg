<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a2624"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" stroke="#2dd4bf" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Top Meme Header -->
  <rect x="16" y="12" width="368" height="26" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#2dd4bf" letter-spacing="1.5" text-anchor="middle" filter="url(#glow)">SKINCARE GURU</text>
  <!-- Artwork Graphic -->
  <g id="artwork">
    
      <!-- Spa Cat in Towel -->
      <circle cx="200" cy="115" r="45" fill="#fef3c7"/>
      <!-- Hair towel wrap -->
      <path d="M160,95 Q200,40 240,95 Z" fill="#ec4899"/>
      <circle cx="200" cy="50" r="14" fill="#ec4899"/>
      <!-- Cucumber Slices on Eyes -->
      <circle cx="180" cy="112" r="14" fill="#84cc16" stroke="#4d7c0f" stroke-width="3"/>
      <circle cx="180" cy="112" r="6" fill="#bef264"/>
      <circle cx="220" cy="112" r="14" fill="#84cc16" stroke="#4d7c0f" stroke-width="3"/>
      <circle cx="220" cy="112" r="6" fill="#bef264"/>
      <!-- Smile -->
      <path d="M195,135 Q200,140 205,135" stroke="#78350f" stroke-width="2" fill="none"/>
      <!-- Sparkle effects -->
      <text x="135" y="90" font-size="22">✨</text>
      <text x="245" y="90" font-size="22">✨</text>
      <text x="190" y="180" font-size="20">🧖‍♀️</text>
    
  </g>
  <!-- Bottom Meme Caption -->
  <rect x="12" y="202" width="376" height="28" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="200" y="221" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">THỨC KHUYA KHÔNG MỤN - DA CĂNG BÓNG MƯỚT MỊN</text>
</svg>