<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b180a"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" stroke="#f97316" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Top Meme Header -->
  <rect x="16" y="12" width="368" height="26" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#f97316" letter-spacing="1.5" text-anchor="middle" filter="url(#glow)">FOODIE HEAVEN</text>
  <!-- Artwork Graphic -->
  <g id="artwork">
    
      <!-- Table of Feast -->
      <ellipse cx="200" cy="175" rx="100" ry="25" fill="#fed7aa"/>
      <!-- Sushi & Pizza -->
      <text x="120" y="175" font-size="28">🍣</text>
      <text x="160" y="170" font-size="28">🍕</text>
      <text x="210" y="170" font-size="28">🍔</text>
      <text x="250" y="175" font-size="28">🍰</text>
      <!-- Happy Bear Holding Fork & Knife -->
      <circle cx="200" cy="95" r="40" fill="#b45309"/>
      <circle cx="165" cy="65" r="14" fill="#78350f"/>
      <circle cx="235" cy="65" r="14" fill="#78350f"/>
      <ellipse cx="200" cy="105" rx="18" ry="14" fill="#fde68a"/>
      <circle cx="188" cy="92" r="4" fill="#000"/>
      <circle cx="212" cy="92" r="4" fill="#000"/>
      <ellipse cx="200" cy="102" rx="7" ry="5" fill="#451a03"/>
      <!-- Bib -->
      <path d="M180,125 Q200,145 220,125" fill="#f43f5e"/>
    
  </g>
  <!-- Bottom Meme Caption -->
  <rect x="12" y="202" width="376" height="28" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="200" y="221" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">ĂN NGON NGẬP TRÀN - BẠN BÈ TRANH NHAU BAO</text>
</svg>