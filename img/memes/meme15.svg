<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1424"/>
      <stop offset="100%" stop-color="#0a060e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)" stroke="#c084fc" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Top Meme Header -->
  <rect x="16" y="12" width="368" height="26" rx="6" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="30" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#c084fc" letter-spacing="1.5" text-anchor="middle" filter="url(#glow)">FASHION ICON</text>
  <!-- Artwork Graphic -->
  <g id="artwork">
    
      <!-- French Bulldog in Beret -->
      <circle cx="200" cy="110" r="45" fill="#e2e8f0"/>
      <!-- Chic Beret -->
      <ellipse cx="195" cy="72" rx="36" ry="14" fill="#be123c" transform="rotate(-12 195 72)"/>
      <circle cx="178" cy="60" r="4" fill="#be123c"/>
      <!-- Designer Sunglasses -->
      <ellipse cx="180" cy="108" rx="16" ry="12" fill="#0f172a"/>
      <ellipse cx="220" cy="108" rx="16" ry="12" fill="#0f172a"/>
      <line x1="196" y1="108" x2="204" y2="108" stroke="#eab308" stroke-width="3"/>
      <!-- Trench Coat Collar -->
      <polygon points="160,150 200,180 170,200 135,160" fill="#ca8a04"/>
      <polygon points="240,150 200,180 230,200 265,160" fill="#ca8a04"/>
    
  </g>
  <!-- Bottom Meme Caption -->
  <rect x="12" y="202" width="376" height="28" rx="6" fill="rgba(0,0,0,0.6)"/>
  <text x="200" y="221" font-family="'Segoe UI', -apple-system, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" letter-spacing="0.5" text-anchor="middle">BƯỚC RA ĐƯỜNG LÀ CẢ PHỐ PHẢI NGƯỚC NHÌN</text>
</svg>